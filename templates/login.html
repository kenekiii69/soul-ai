<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login • Soul AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>

    <div class="login-card">

        <h1>Soul AI 💫</h1>

        <p>Welcome back</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="register-btn"
            onclick="location.href='/register-page'">

            Create Account

        </button>


        <p id="login-message"></p>

    </div>


    <!-- Soul AI Authentication -->

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
